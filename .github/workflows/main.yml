name: SmileJobs Recruiter Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/main.yml"

  workflow_dispatch:

concurrency:
  group: smilejobs-recruiter-backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI - Validate Recruiter Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate server.js
        run: node --check src/server.js

      - name: CI completed
        run: echo "Recruiter backend CI validation completed successfully."

  deploy:
    name: CD - Deploy Recruiter Backend to DigitalOcean
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Configure SSH key
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_HOST: ${{ secrets.DO_HOST }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Decode Base64 key cleanly
          echo "$DO_SSH_KEY_B64" | tr -d '\r\n ' | base64 --decode > ~/.ssh/smilejobs_deploy_key
          chmod 600 ~/.ssh/smilejobs_deploy_key

          # Add Droplet to known hosts
          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          echo "SSH configured successfully."

      - name: Deploy Recruiter Backend
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -e

          echo "=========================================="
          echo "Starting SmileJobs Recruiter deployment"
          echo "=========================================="

          ssh \
            -i ~/.ssh/smilejobs_deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DO_USER@$DO_HOST" << 'REMOTE_SCRIPT'

          set -e

          echo "Connected to DigitalOcean successfully."

          echo "=========================================="
          echo "Updating SmileJobs Recruiter Backend"
          echo "=========================================="

          cd /var/www/smilejobs-recruiter

          echo "Fetching latest code..."
          git fetch origin main

          echo "Updating production code..."
          git reset --hard origin/main

          echo "Entering recruiter backend directory..."
          cd backend

          echo "Installing recruiter backend dependencies..."
          npm ci --omit=dev --legacy-peer-deps

          echo "Validating server.js..."
          node --check src/server.js

          echo "Checking PM2 application..."

          if pm2 describe smilejobs-recruiter > /dev/null 2>&1; then
            echo "Restarting ONLY smilejobs-recruiter..."
            pm2 restart smilejobs-recruiter --update-env
          else
            echo "PM2 application not found. Starting recruiter backend..."
            pm2 start src/server.js --name smilejobs-recruiter
            pm2 save
          fi

          echo "Waiting for recruiter backend to warm up..."
          sleep 5

          echo "PM2 status:"
          pm2 status

          echo "Checking recruiter backend health..."
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:5002/health || echo "Health check endpoint skipped or warming up."

          echo ""
          echo "=========================================="
          echo "SmileJobs Recruiter backend deployment successful"
          echo "=========================================="

          REMOTE_SCRIPT

      - name: Deployment completed
        run: echo "Recruiter backend production deployment completed successfully."
